    <title>Knockout — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Knockout FFGL effect for Resolume in your browser: text as a mask, the clip showing through the letters or the letters cut out of it, each letter drawn from its font's own curves so it stays sharp at any size and any zoom. The plugin's own C++ — font scan, outline reader, layout and both GPU passes — compiled unmodified to WebAssembly, drawing with its own GLSL in WebGL2, with four bundled open-licence fonts. A demo, not the plugin." />

          <a href="https://github.com/stoatworks-labs/knockout">its repository</a>.
        </p>
      </noscript>
