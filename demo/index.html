  <body>
    <main id="demo">
      <noscript>
        <h1>Knockout</h1>
        <p>
          An FFGL effect for Resolume that turns your words, in any font you
          have installed, into a mask over the clip: the clip through the
          letters, or the letters cut out of it, on transparency, black, white
          or a colour. The letters aren't a picture of the text. Every pixel
          asks the font's own curves whether it's inside a letter, so a word
          stays sharp whether it fills the frame or you've zoomed a thousand
          times into one stroke of it.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/knockout">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/knockout/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/knockout">Source on GitHub</a></li>
        </ul>
      </noscript>
